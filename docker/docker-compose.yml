name: studyhub

x-env: &common-env
  env_file:
    - ../.env

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: studyhub
      POSTGRES_PASSWORD: studyhub
      POSTGRES_DB: studyhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studyhub -d studyhub']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies Drizzle migrations, then exits. web/worker wait for it.
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    <<: *common-env
    command: ['node', 'packages/db/dist/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    <<: *common-env
    ports:
      - '3000:3000'
    volumes:
      - ${STUDYHUB_DATA:-../data}:/data
      - claude-auth:/home/studyhub/.claude
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    <<: *common-env
    volumes:
      - ${STUDYHUB_DATA:-../data}:/data
      - claude-auth:/home/studyhub/.claude
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 1

volumes:
  pgdata:
  # Per-installation Claude login (written from /admin, read by web + worker).
  claude-auth:
