<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Modalità esame · Simulazione 4</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.sh{--bg-base:#0a0b0f;--bg-surface:#111318;--bg-raised:#171a21;--bg-inset:#0d0e13;--border:#22262f;--border-strong:#2e3441;--fg-primary:#e8eaf0;--fg-secondary:#9ba3b4;--fg-muted:#7a8394;--accent:#5b8cff;--accent-hover:#7aa2ff;--accent-subtle:#5b8cff1f;--on-accent:#0a0b0f;--ok:#3dd68c;--warn:#f5b544;--danger:#ff6b6b;--info:#4ecdc4;--subject:#8b5cf6;position:relative;font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.45;color:var(--fg-primary);background:var(--bg-base);-webkit-font-smoothing:antialiased}
.sh.light{--bg-base:#f6f7f9;--bg-surface:#ffffff;--bg-raised:#eef0f4;--bg-inset:#eceff3;--border:#dde1e8;--border-strong:#c5ccd8;--fg-primary:#14171f;--fg-secondary:#444c5c;--fg-muted:#5f6879;--accent:#2a5bd7;--accent-hover:#1f49b3;--accent-subtle:#2a5bd71a;--on-accent:#ffffff;--ok:#0c7a52;--warn:#8f5a00;--danger:#c22b2b;--info:#0a7570;--subject:#7c3aed}
.sh *{box-sizing:border-box}
.sh h1,.sh h2,.sh p{margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.sh a{color:var(--accent);text-decoration:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0;border:0;border-radius:8px;background:transparent;color:var(--fg-secondary);cursor:pointer}
.sh a.ib{color:var(--fg-secondary)}
.ib:disabled{opacity:.35;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-raised);color:var(--fg-primary);font:600 14px/1 Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.sh a.btn{color:var(--fg-primary)}
.btn.pri,.sh a.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ex{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex-shrink:0;border-radius:8px;border:1px solid var(--border);background:var(--bg-surface);color:var(--fg-secondary);font:600 14px 'JetBrains Mono',monospace;cursor:pointer}
.ex.done{border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok)}
.ex.on{border-color:var(--accent);background:var(--accent-subtle);color:var(--fg-primary)}
</style>
</helmet>
<div class="sh {{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
<header style="flex-shrink: 0; display: flex; flex-direction: column; border-bottom: 1px solid var(--border); background: var(--bg-surface)">
<div style="display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 12px 0 4px">
<a class="ib" href="Simulazioni.dc.html" aria-label="Esci dalla simulazione"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
<div style="flex: 1; min-width: 0">
<h1 style="font-size: 15px; font-weight: 600">Simulazione 4</h1>
<p style="font-size: 12px; color: var(--fg-muted)">Salvato · 10:42</p>
</div>
<div role="timer" aria-label="Tempo rimasto" style="display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; background: var(--bg-raised)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--fg-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
<span class="mono" style="font-size: 16px; font-weight: 600">2:14:08</span>
</div>
</div>
<p style="padding: 6px 16px; font-size: 12px; color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); border-top: 1px solid var(--border)">Modalità esame · nessun aiuto disponibile</p>
</header>

<div style="flex-shrink: 0; display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none" role="group" aria-label="Esercizi">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="6"><button class="ex {{t.cls}}" onClick="{{t.go}}" aria-label="Esercizio {{t.n}}">{{t.n}}</button></sc-for>
</div>

<main style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<p style="font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-muted)">Esercizio {{cur.n}} di 6</p>
<span class="mono" style="font-size: 13px; color: var(--fg-secondary)">{{cur.pts}} punti</span>
</div>
<h2 style="font-size: 18px; font-weight: 500; line-height: 1.5">{{cur.text}}</h2>
<label for="answer" style="font-size: 13px; color: var(--fg-secondary)">La tua risposta</label>
<textarea id="answer" placeholder="Scrivi qui il procedimento…" style="flex: 1; min-height: 220px; resize: none; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg-inset); color: var(--fg-primary); font: 400 16px/1.5 Inter, system-ui, sans-serif" value="{{cur.answer}}" onChange="{{noop}}"></textarea>
<button class="btn" style="align-self: flex-start; min-height: 40px; font-size: 13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>Allega foto del foglio</button>
</main>

<div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px 24px; border-top: 1px solid var(--border); background: var(--bg-surface)">
<button class="ib" aria-label="Esercizio precedente" onClick="{{prev}}" disabled="{{first}}" style="border: 1px solid var(--border-strong)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>
<sc-if value="{{last}}" hint-placeholder-val="{{false}}"><a class="btn pri" href="Risultati.dc.html" style="flex: 1">Consegna</a></sc-if>
<sc-if value="{{notLast}}" hint-placeholder-val="{{true}}"><button class="btn pri" onClick="{{next}}" style="flex: 1">Esercizio successivo</button></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { i: 1 };
}
renderVals() {
const ex = [
{ pts: 5, text: 'Calcolare il limite per x → 0 di (eˣ − 1 − x) / x².', answer: 'Sviluppo di Taylor: eˣ = 1 + x + x²/2 + o(x²), quindi il limite vale 1/2.' },
{ pts: 6, text: 'Studiare la convergenza dell’integrale improprio ∫₁^∞ (ln x) / x² dx e, se converge, calcolarlo.', answer: '' },
{ pts: 5, text: 'Studiare il carattere della serie Σ n! / nⁿ.', answer: '' },
{ pts: 6, text: 'Studiare la funzione f(x) = x e^(−x²) e tracciarne il grafico.', answer: '' },
{ pts: 4, text: 'Risolvere il problema di Cauchy y′ = 2xy, y(0) = 3.', answer: '' },
{ pts: 4, text: 'Enunciare e dimostrare il teorema di Rolle.', answer: '' }
];
const i = this.state.i;
const tabs = ex.map((e, k) => ({ n: k + 1, cls: k === i ? 'on' : e.answer ? 'done' : '', go: () => this.setState({ i: k }) }));
return {
theme: this.props.theme === 'chiaro' ? 'light' : '',
tabs, cur: { ...ex[i], n: i + 1 }, noop: () => {},
first: i === 0, last: i === ex.length - 1, notLast: i !== ex.length - 1,
prev: () => this.setState({ i: Math.max(0, i - 1) }),
next: () => this.setState({ i: Math.min(ex.length - 1, i + 1) })
};
}
}
</script>
</body>
</html>
