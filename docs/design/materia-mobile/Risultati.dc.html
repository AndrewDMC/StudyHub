<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Risultati · Simulazione 3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.sh{--bg-base:#0a0b0f;--bg-surface:#111318;--bg-raised:#171a21;--bg-inset:#0d0e13;--border:#22262f;--border-strong:#2e3441;--fg-primary:#e8eaf0;--fg-secondary:#9ba3b4;--fg-muted:#7a8394;--accent:#5b8cff;--accent-hover:#7aa2ff;--accent-subtle:#5b8cff1f;--on-accent:#0a0b0f;--ok:#3dd68c;--warn:#f5b544;--danger:#ff6b6b;--info:#4ecdc4;--subject:#8b5cf6;position:relative;font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.45;color:var(--fg-primary);background:var(--bg-base);-webkit-font-smoothing:antialiased}
.sh.light{--bg-base:#f6f7f9;--bg-surface:#ffffff;--bg-raised:#eef0f4;--bg-inset:#eceff3;--border:#dde1e8;--border-strong:#c5ccd8;--fg-primary:#14171f;--fg-secondary:#444c5c;--fg-muted:#5f6879;--accent:#2a5bd7;--accent-hover:#1f49b3;--accent-subtle:#2a5bd71a;--on-accent:#ffffff;--ok:#0c7a52;--warn:#8f5a00;--danger:#c22b2b;--info:#0a7570;--subject:#7c3aed}
.sh *{box-sizing:border-box}
.sh h1,.sh h2,.sh h3,.sh p{margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.gridbg{background-image:linear-gradient(to right,color-mix(in srgb,var(--fg-primary) 3%,transparent) 1px,transparent 1px),linear-gradient(to bottom,color-mix(in srgb,var(--fg-primary) 3%,transparent) 1px,transparent 1px);background-size:24px 24px}
.sh a{color:var(--accent);text-decoration:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0;border:0;border-radius:8px;background:transparent;color:var(--fg-secondary);cursor:pointer}
.sh a.ib{color:var(--fg-secondary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-raised);color:var(--fg-primary);font:600 14px/1 Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.sh a.btn{color:var(--fg-primary)}
.btn.pri,.sh a.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-muted)}
.exh{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 14px;border:0;background:transparent;color:var(--fg-primary);font:inherit;text-align:left;cursor:pointer}
.bar{height:6px;border-radius:3px;background:var(--bg-raised);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:3px}
.blk{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:10px;background:var(--bg-inset);border:1px solid var(--border)}
</style>
</helmet>
<div class="sh {{theme}}" style="width: 390px; height: 1400px; display: flex; flex-direction: column; overflow: hidden">
<header style="flex-shrink: 0; display: flex; align-items: center; gap: 2px; height: 52px; padding: 0 4px; border-bottom: 1px solid var(--border); background: var(--bg-surface)">
<a class="ib" href="Simulazioni.dc.html" aria-label="Torna alle simulazioni"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
<div style="flex: 1; min-width: 0; padding-left: 4px">
<p style="font-size: 12px; color: var(--fg-muted)">Risultati</p>
<h1 style="font-size: 15px; font-weight: 600">Simulazione 3</h1>
</div>
</header>
<main class="gridbg" style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 20px">

<section class="card" style="padding: 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<b class="mono" style="font-size: 48px; font-weight: 600; line-height: 1; letter-spacing: -0.03em">21<span style="font-size: 24px; color: var(--fg-muted); font-weight: 400">/30</span></b>
<p style="font-size: 15px; color: var(--fg-secondary)">Sufficiente · 1 esercizio sotto la metà</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%; margin-top: 12px">
<a class="btn pri" href="Esame.dc.html">Drill sugli errori</a>
<button class="btn">Seconda opinione</button>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 10px">
<h2 class="lbl">Correzione</h2>
<sc-for list="{{items}}" as="x" hint-placeholder-count="6">
<article class="card" style="overflow: hidden">
<button class="exh" onClick="{{x.toggle}}" aria-expanded="{{x.expanded}}">
<span class="mono" style="width: 24px; font-size: 13px; color: var(--fg-muted)">{{x.n}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{x.title}}</span>
<span class="bar"><span style="width: {{x.pct}}%; background: {{x.color}}"></span></span>
</span>
<b class="mono" style="font-size: 15px; {{x.scoreStyle}}">{{x.awarded}}/{{x.max}}</b>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--fg-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{x.rot}}deg)"><path d="m9 6 6 6-6 6"></path></svg>
</button>
<sc-if value="{{x.open}}" hint-placeholder-val="{{false}}">
<div style="padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px">
<div class="blk"><span class="lbl" style="font-size: 11px">La tua risposta</span><p style="font-size: 14px">{{x.answer}}</p></div>
<div class="blk" style="background: color-mix(in srgb, var(--warn) 8%, var(--bg-inset)); border-color: color-mix(in srgb, var(--warn) 30%, transparent)"><span class="lbl" style="font-size: 11px; color: var(--warn)">Correzione</span><p style="font-size: 14px">{{x.feedback}}</p></div>
<div class="blk"><span class="lbl" style="font-size: 11px">Soluzione di riferimento</span><p style="font-size: 14px">{{x.solution}}</p></div>
</div>
</sc-if>
</article>
</sc-for>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro"},"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: 1 };
}
renderVals() {
const data = [
['Limite con Taylor', 5, 5, 'Sviluppo al secondo ordine, limite 1/2.', 'Corretto e completo.', 'eˣ = 1 + x + x²/2 + o(x²) ⇒ limite 1/2.'],
['Integrale improprio di ln x / x²', 2, 6, 'Converge per confronto con 1/x². Non calcolato.', 'Convergenza giusta ma il criterio va motivato: ln x ≤ √x definitivamente. Manca il calcolo per parti.', 'Per parti: ∫ ln x / x² dx = −(ln x + 1)/x; vale 1.'],
['Serie Σ n! / nⁿ', 4, 5, 'Criterio del rapporto, limite 1/e < 1: converge.', 'Corretto; manca il passaggio sul limite notevole (1 + 1/n)ⁿ.', 'aₙ₊₁/aₙ = (n/(n+1))ⁿ → 1/e.'],
['Studio di f(x) = x e^(−x²)', 3, 6, 'Dominio, simmetria, massimo in 1/√2.', 'Mancano flessi e grafico.', 'f dispari, max in 1/√2, flessi in 0 e ±√(3/2).'],
['Problema di Cauchy y′ = 2xy', 4, 4, 'y = 3e^(x²).', 'Corretto.', 'Variabili separabili: y = 3e^(x²).'],
['Teorema di Rolle', 3, 4, 'Enunciato corretto, dimostrazione con Weierstrass.', 'Manca il caso f costante.', 'Weierstrass + Fermat; se max e min sono agli estremi f è costante.']
];
const items = data.map(([title, awarded, max, answer, feedback, solution], i) => {
const r = awarded / max;
const open = this.state.open === i;
return {
n: i + 1, title, awarded, max, answer, feedback, solution, open,
expanded: open ? 'true' : 'false', rot: open ? 90 : 0,
pct: Math.round(r * 100),
color: r >= 0.8 ? 'var(--ok)' : r >= 0.5 ? 'var(--warn)' : 'var(--danger)',
scoreStyle: r < 0.5 ? 'color: var(--danger)' : '',
toggle: () => this.setState({ open: open ? -1 : i })
};
});
return { theme: this.props.theme === 'chiaro' ? 'light' : '', items };
}
}
</script>
</body>
</html>
