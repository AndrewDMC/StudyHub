<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { kind: 'flashcard' };
}
renderVals() {
const kinds = { flashcard: 'flashcard', riassunto: 'riassunto', schema: 'schema', esercizi: 'esercizi' };
const c = {};
const pick = {};
Object.keys(kinds).forEach((k) => {
c[k] = this.state.kind === k ? 'on' : '';
pick[k] = () => this.setState({ kind: k });
});
return { theme: this.props.theme === 'chiaro' ? 'light' : '', c, pick, label: kinds[this.state.kind] };
}
}
</script>
