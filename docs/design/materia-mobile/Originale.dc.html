<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Lezione 14 · originale</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.sh{--bg-base:#0a0b0f;--bg-surface:#111318;--bg-raised:#171a21;--bg-inset:#0d0e13;--border:#22262f;--border-strong:#2e3441;--fg-primary:#e8eaf0;--fg-secondary:#9ba3b4;--fg-muted:#7a8394;--accent:#5b8cff;--accent-hover:#7aa2ff;--accent-subtle:#5b8cff1f;--on-accent:#0a0b0f;--ok:#3dd68c;--warn:#f5b544;--danger:#ff6b6b;--info:#4ecdc4;--subject:#8b5cf6;position:relative;font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.45;color:var(--fg-primary);background:var(--bg-base);-webkit-font-smoothing:antialiased}
.sh.light{--bg-base:#f6f7f9;--bg-surface:#ffffff;--bg-raised:#eef0f4;--bg-inset:#eceff3;--border:#dde1e8;--border-strong:#c5ccd8;--fg-primary:#14171f;--fg-secondary:#444c5c;--fg-muted:#5f6879;--accent:#2a5bd7;--accent-hover:#1f49b3;--accent-subtle:#2a5bd71a;--on-accent:#ffffff;--ok:#0c7a52;--warn:#8f5a00;--danger:#c22b2b;--info:#0a7570;--subject:#7c3aed}
.sh *{box-sizing:border-box}
.sh h1,.sh p{margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.sh a{color:var(--accent);text-decoration:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0;border:0;border-radius:8px;background:transparent;color:var(--fg-secondary);cursor:pointer}
.sh a.ib{color:var(--fg-secondary)}
.ib:disabled{opacity:.35;cursor:default}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:10px;background:var(--bg-inset);border:1px solid var(--border)}
.seg a{display:flex;align-items:center;justify-content:center;min-height:36px;border-radius:7px;font-size:13px;font-weight:500}
.sh .seg a{color:var(--fg-secondary)}
.sh .seg a.on{background:var(--bg-raised);color:var(--fg-primary);box-shadow:0 0 0 1px var(--border-strong)}
.ln{height:7px;border-radius:2px;background:#d9dce3}
</style>
</helmet>
<div class="sh {{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-inset)">
<header style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 4px; border-bottom: 1px solid var(--border); background: var(--bg-surface)">
<a class="ib" href="Materiale.dc.html" aria-label="Torna al materiale"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
<div class="seg" role="tablist" aria-label="Vista del documento" style="flex: 1">
<a role="tab" aria-selected="false" href="Documento.dc.html">Testo</a>
<a class="on" role="tab" aria-selected="true" href="Originale.dc.html">Originale</a>
</div>
<button class="ib" aria-label="Apri in un'altra app"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"></path></svg></button>
</header>
<main style="flex: 1; min-height: 0; overflow: auto; padding: 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 16px">
<div role="img" aria-label="Pagina {{page}} del PDF" style="width: 100%; aspect-ratio: 1 / 1.414; border-radius: 4px; background: #fbfbf9; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4); padding: 28px 24px; display: flex; flex-direction: column; gap: 10px; transform-origin: top center; transform: scale({{zoom}})">
<div style="height: 12px; width: 58%; border-radius: 2px; background: #9aa0ad"></div>
<div style="height: 6px"></div>
<div class="ln" style="width: 100%"></div><div class="ln" style="width: 94%"></div><div class="ln" style="width: 97%"></div><div class="ln" style="width: 62%"></div>
<div style="margin: 8px 0; padding: 14px; border: 1px dashed #b9bec9; border-radius: 4px; text-align: center; font: 500 12px 'JetBrains Mono', monospace; color: #6a7080">[ pagina {{page}} del PDF originale ]</div>
<div class="ln" style="width: 100%"></div><div class="ln" style="width: 91%"></div><div class="ln" style="width: 96%"></div><div class="ln" style="width: 88%"></div><div class="ln" style="width: 45%"></div>
<div style="height: 6px"></div>
<div class="ln" style="width: 100%"></div><div class="ln" style="width: 93%"></div><div class="ln" style="width: 70%"></div>
</div>
</main>
<div style="flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px 22px; border-top: 1px solid var(--border); background: var(--bg-surface)">
<div style="display: flex; align-items: center">
<button class="ib" aria-label="Riduci" onClick="{{zoomOut}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5M8 11h6"></path></svg></button>
<button class="ib" aria-label="Ingrandisci" onClick="{{zoomIn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5M8 11h6M11 8v6"></path></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 4px">
<button class="ib" aria-label="Pagina precedente" onClick="{{prev}}" disabled="{{atStart}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>
<span class="mono" style="min-width: 64px; text-align: center; font-size: 14px" aria-live="polite">{{page}} / 18</span>
<button class="ib" aria-label="Pagina successiva" onClick="{{next}}" disabled="{{atEnd}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { page: 3, zoom: 1 };
}
renderVals() {
const { page, zoom } = this.state;
return {
theme: this.props.theme === 'chiaro' ? 'light' : '',
page, zoom,
atStart: page <= 1, atEnd: page >= 18,
prev: () => this.setState({ page: Math.max(1, page - 1) }),
next: () => this.setState({ page: Math.min(18, page + 1) }),
zoomIn: () => this.setState({ zoom: Math.min(1.6, +(zoom + 0.2).toFixed(1)) }),
zoomOut: () => this.setState({ zoom: Math.max(1, +(zoom - 0.2).toFixed(1)) })
};
}
}
</script>
</body>
</html>
