<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Revisione flashcard · Integrali impropri</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.sh{--bg-base:#0a0b0f;--bg-surface:#111318;--bg-raised:#171a21;--bg-inset:#0d0e13;--border:#22262f;--border-strong:#2e3441;--fg-primary:#e8eaf0;--fg-secondary:#9ba3b4;--fg-muted:#7a8394;--accent:#5b8cff;--accent-hover:#7aa2ff;--accent-subtle:#5b8cff1f;--on-accent:#0a0b0f;--ok:#3dd68c;--warn:#f5b544;--danger:#ff6b6b;--info:#4ecdc4;--subject:#8b5cf6;position:relative;font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.45;color:var(--fg-primary);background:var(--bg-base);-webkit-font-smoothing:antialiased}
.sh.light{--bg-base:#f6f7f9;--bg-surface:#ffffff;--bg-raised:#eef0f4;--bg-inset:#eceff3;--border:#dde1e8;--border-strong:#c5ccd8;--fg-primary:#14171f;--fg-secondary:#444c5c;--fg-muted:#5f6879;--accent:#2a5bd7;--accent-hover:#1f49b3;--accent-subtle:#2a5bd71a;--on-accent:#ffffff;--ok:#0c7a52;--warn:#8f5a00;--danger:#c22b2b;--info:#0a7570;--subject:#7c3aed}
.sh *{box-sizing:border-box}
.sh h1,.sh h2,.sh h3,.sh p{margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.gridbg{background-image:linear-gradient(to right,color-mix(in srgb,var(--fg-primary) 3%,transparent) 1px,transparent 1px),linear-gradient(to bottom,color-mix(in srgb,var(--fg-primary) 3%,transparent) 1px,transparent 1px);background-size:24px 24px}
.sh a{color:var(--accent);text-decoration:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0;border:0;border-radius:8px;background:transparent;color:var(--fg-secondary);cursor:pointer}
.sh a.ib{color:var(--fg-secondary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-raised);color:var(--fg-primary);font:600 14px/1 Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.sh a.btn{color:var(--fg-primary)}
.btn.pri,.sh a.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-muted)}
.qa{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-muted)}
.act{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--fg-secondary);font:500 13px Inter,system-ui,sans-serif;cursor:pointer}
.act.keep{border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.act.drop{border-color:color-mix(in srgb,var(--danger) 45%,transparent);color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
</style>
</helmet>
<div class="sh {{theme}}" style="width: 390px; height: 1550px; display: flex; flex-direction: column; overflow: hidden">
<header style="flex-shrink: 0; display: flex; align-items: center; gap: 2px; height: 52px; padding: 0 4px; border-bottom: 1px solid var(--border); background: var(--bg-surface)">
<a class="ib" href="Flashcard.dc.html" aria-label="Chiudi la revisione"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
<div style="flex: 1; min-width: 0; padding-left: 4px">
<p style="font-size: 12px; color: var(--fg-muted)">Revisione flashcard</p>
<h1 style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Integrali impropri</h1>
</div>
<span class="mono" style="padding-right: 12px; font-size: 13px; color: var(--fg-secondary)">{{reviewed}}/24</span>
</header>
<main class="gridbg" style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<p style="font-size: 13px; color: var(--fg-secondary)">Generate da <a href="Documento.dc.html">Lezione 14 – Integrali impropri.pdf</a>. Tieni, modifica o scarta: solo le card tenute entrano nel ripasso.</p>
<sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
<article class="card" style="padding: 14px; display: flex; flex-direction: column; gap: 10px; {{c.ring}}">
<div><p class="qa">Domanda</p><p style="font-size: 15px; font-weight: 500; {{c.strike}}">{{c.q}}</p></div>
<div style="padding-top: 10px; border-top: 1px solid var(--border)"><p class="qa">Risposta</p><p style="font-size: 14px; color: var(--fg-secondary); {{c.strike}}">{{c.a}}</p></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<button class="act {{c.cKeep}}" onClick="{{c.keep}}" aria-pressed="{{c.isKeep}}">Tieni</button>
<button class="act">Modifica</button>
<button class="act {{c.cDrop}}" onClick="{{c.drop}}" aria-pressed="{{c.isDrop}}">Scarta</button>
</div>
</article>
</sc-for>
</main>
<div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 24px; border-top: 1px solid var(--border); background: var(--bg-surface)">
<p style="font-size: 13px; color: var(--fg-secondary); text-align: center"><span class="mono">{{kept}}</span> tenute · <span class="mono">{{dropped}}</span> scartate · {{left}} da vedere</p>
<a class="btn pri" href="Flashcard.dc.html" style="width: 100%">Approva il mazzo</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro"},"$preview":{"width":390,"height":1550}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { s: ['keep', 'keep', 'drop', '', '', ''] };
}
renderVals() {
const data = [
['Definizione di integrale improprio su [a, +∞)', 'Limite per t → +∞ dell’integrale da a a t, se esiste finito.'],
['Per quali p converge ∫₁^∞ 1/xᵖ dx?', 'Per p > 1.'],
['Cos’è un integrale?', 'Un’area.'],
['Enuncia il criterio del confronto', 'Se 0 ≤ f ≤ g e g è integrabile, anche f lo è.'],
['Quando si usa il confronto asintotico?', 'Con f, g positive e f ~ g: stesso carattere.'],
['∫₀¹ 1/√x dx converge?', 'Sì: vale 2.']
];
const set = (i, v) => () => { const s = this.state.s.slice(); s[i] = s[i] === v ? '' : v; this.setState({ s }); };
const cards = data.map(([q, a], i) => {
const v = this.state.s[i];
return {
q, a,
cKeep: v === 'keep' ? 'keep' : '', cDrop: v === 'drop' ? 'drop' : '',
isKeep: v === 'keep' ? 'true' : 'false', isDrop: v === 'drop' ? 'true' : 'false',
strike: v === 'drop' ? 'text-decoration: line-through; opacity: .55' : '',
ring: v === 'keep' ? 'border-color: color-mix(in srgb, var(--ok) 35%, var(--border))' : '',
keep: set(i, 'keep'), drop: set(i, 'drop')
};
});
const kept = this.state.s.filter((v) => v === 'keep').length;
const dropped = this.state.s.filter((v) => v === 'drop').length;
return { theme: this.props.theme === 'chiaro' ? 'light' : '', cards, kept, dropped, reviewed: kept + dropped, left: 24 - kept - dropped };
}
}
</script>
</body>
</html>
